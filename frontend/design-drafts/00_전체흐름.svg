<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.06"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#fff"/>
<text x="80" y="100" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="800" fill="#111827" text-anchor="start" letter-spacing="-0.6">TraceGuard 전체 화면 흐름</text>
<text x="80" y="138" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="400" fill="#6b7280" text-anchor="start">배포본 발급(신규 07~09)과 유출 조사(기존 02~06)가 랜딩에서 갈라지고, 발급 완료 화면에서 다시 유출 조사로 이어집니다.</text>
<rect x="1460" y="74" width="18" height="18" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="1488" y="89" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">신규 화면</text>
<rect x="1590" y="74" width="18" height="18" rx="4" fill="#fff" stroke="#d6deeb" stroke-width="1.5"/><text x="1618" y="89" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">기존 화면 (변경 없음)</text>
<rect x="1460" y="104" width="18" height="18" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/><text x="1488" y="119" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="400" fill="#374151" text-anchor="start">기존 화면에 요소 추가</text>
<rect x="80" y="470" width="240" height="120" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" filter="url(#sh)"/><text x="100" y="504" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">01 · 수정</text><text x="100" y="532" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">랜딩</text><text x="100" y="556" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">진입 카드 2개 (분석 · 발급)</text>
<text x="400" y="260" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="start">유출 조사</text><text x="494.0" y="260" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">기존 화면</text>
<rect x="400" y="300" width="230" height="104" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" filter="url(#sh)"/><text x="420" y="334" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">02 · 수정</text><text x="420" y="362" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">파일 업로드</text><text x="420" y="386" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">+ 사본 발급 보조 링크</text>
<path d="M630 352 L686 352" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="690" y="300" width="230" height="104" rx="14" fill="#fff" stroke="#d6deeb" stroke-width="1.5" filter="url(#sh)"/><text x="710" y="334" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">03</text><text x="710" y="362" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">분석 시작</text><text x="710" y="386" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">파일 확인 · 분석 시작</text>
<path d="M920 352 L976 352" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="980" y="300" width="230" height="104" rx="14" fill="#fff" stroke="#d6deeb" stroke-width="1.5" filter="url(#sh)"/><text x="1000" y="334" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">04</text><text x="1000" y="362" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">분석 진행</text><text x="1000" y="386" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">1초 폴링 · 취소</text>
<path d="M1210 352 L1266 352" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="1270" y="300" width="230" height="104" rx="14" fill="#fff" stroke="#d6deeb" stroke-width="1.5" filter="url(#sh)"/><text x="1290" y="334" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">05</text><text x="1290" y="362" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">결과 확인</text><text x="1290" y="386" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">사본 · 원본 · 검출 등급</text>
<path d="M1500 352 L1556 352" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="1560" y="300" width="230" height="104" rx="14" fill="#fff" stroke="#d6deeb" stroke-width="1.5" filter="url(#sh)"/><text x="1580" y="334" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">06</text><text x="1580" y="362" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">배포 경로 모달</text><text x="1580" y="386" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">원본 → … → 식별된 사본</text>
<text x="400" y="640" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="start">배포본 발급</text><text x="512.6" y="640" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="400" fill="#2563eb" text-anchor="start">신규 화면</text>
<rect x="400" y="680" width="230" height="104" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/><text x="420" y="714" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">07 · 신규</text><text x="420" y="742" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">문서 등록</text><text x="420" y="766" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">제목 · 원본 이미지</text>
<path d="M630 732 L686 732" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="690" y="680" width="230" height="104" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/><text x="710" y="714" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">08 · 신규</text><text x="710" y="742" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">사본 발급</text><text x="710" y="766" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">받는 사람 · 전달받은 사본</text>
<path d="M920 732 L976 732" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="980" y="680" width="230" height="104" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/><text x="1000" y="714" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">09 · 신규</text><text x="1000" y="742" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start">발급 완료 · 사본 대장</text><text x="1000" y="766" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">배포본 다운로드</text>
<path d="M320 510 C 360 510, 350 352, 396 352" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<text x="250" y="420" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">유출 문서 분석 시작</text>
<path d="M320 550 C 360 550, 350 732, 396 732" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#ar)"/>
<text x="250" y="646" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">배포본 발급하기</text>
<path d="M515 404 L515 676" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arg)"/>
<text x="526" y="494.0" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="start">워터마크 사본 발급하기 (보조 링크)</text>
<path d="M1095 678 C 1095 560, 640 620, 560 408" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arg)"/>
<text x="910" y="584" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="start">유출 이미지 분석하기</text>
<path d="M1095 786 C 1095 850, 805 850, 805 788" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arg)"/>
<text x="950" y="860" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">사본 하나 더 발급</text>
<rect x="1270" y="680" width="520" height="210" rx="14" fill="#f5f8fd"/>
<text x="1294" y="716" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="800" fill="#111827" text-anchor="start">두 흐름을 잇는 데이터</text>
<circle cx="1300" cy="746" r="3" fill="#2563eb"/><text x="1314" y="751" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">08에서 발급한 사본은 사본 대장(GET /api/recipients)에 기록</text>
<circle cx="1300" cy="776" r="3" fill="#2563eb"/><text x="1314" y="781" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">05·06의 배포 경로는 이 대장의 부모 관계를 따라 계산</text>
<circle cx="1300" cy="806" r="3" fill="#2563eb"/><text x="1314" y="811" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">07 원본 이미지에 사본마다 고유 워터마크(사본 ID)를 삽입</text>
<circle cx="1300" cy="836" r="3" fill="#2563eb"/><text x="1314" y="841" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">문서 목록 API가 없어 07은 목록 없이 새 문서만 등록</text>
<circle cx="1300" cy="866" r="3" fill="#2563eb"/><text x="1314" y="871" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">실제 유출자를 확정하지 않으며, 배포 시각은 표시하지 않음</text>
</svg>