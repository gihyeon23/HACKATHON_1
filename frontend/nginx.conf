# 프론트 정적 파일 + /api 를 backend 로 넘기는 설정 (docker-compose 의 frontend 서비스)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 최대 50MB (백엔드 multipart 한도 55MB 와 맞춤). 기본 1MB 면 사진 업로드가 막힌다
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 브라우저 → nginx 는 같은 출처라 CORS 대상이 아니다. Origin 을 넘기면 백엔드가 교차 출처로 보고 막으므로 지운다
        proxy_set_header Origin "";
        # 사본 발급 · 분석은 엔진 호출로 수 초 걸릴 수 있다
        proxy_read_timeout 180s;
    }

    # 화면 전환은 앱 상태로 하지만, 새로고침 · #viewer 진입도 index.html 로
    location / {
        try_files $uri /index.html;
    }

    # 빌드 산출물은 파일명에 해시가 붙으므로 오래 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
