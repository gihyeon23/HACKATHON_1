spring:
  application:
    name: jeongbobada

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jeongbobada?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: ${PORT:8080}
